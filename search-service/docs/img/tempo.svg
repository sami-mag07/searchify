<svg xmlns="http://www.w3.org/2000/svg" width="800" height="484" viewBox="0 0 800 484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="800" height="484" rx="12" fill="#FFFFFF" stroke="#EAECEF"/><text x="24.0" y="34.0" font-size="17" fill="#1F2328" text-anchor="start" font-weight="650">How long does a typical request take?</text><text x="24.0" y="58.0" font-size="13.5" fill="#1D4ED8" text-anchor="start" font-weight="650">Result: Fine-tuned is not slower: faster for Tavily search and Exa, equal for Serper.</text><text x="24.0" y="80.0" font-size="12" fill="#59636E" text-anchor="start" font-weight="400">Typical response time in seconds (median). Shorter is better.</text><circle cx="30" cy="104" r="6" fill="#E8A80C"/><text x="42.0" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Original provider</text><circle cx="166.0" cy="104" r="6" fill="#E4572E"/><text x="178.0" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Our clone, before (Oct 11)</text><circle cx="356.0" cy="104" r="6" fill="#3B6FE0"/><text x="368.0" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">After fine-tuning</text><text x="24.0" y="167.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Tavily search</text><rect x="224" y="128" width="149.5" height="20" rx="4" fill="#E8A80C"/><text x="381.5" y="143.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">1.33 s</text><rect x="224" y="152" width="140.1" height="20" rx="4" fill="#E4572E"/><text x="372.1" y="167.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">1.25 s</text><rect x="224" y="176" width="104.8" height="20" rx="4" fill="#3B6FE0"/><text x="336.8" y="191.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">0.93 s</text><text x="24.0" y="255.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Serper</text><rect x="224" y="216" width="179.8" height="20" rx="4" fill="#E8A80C"/><text x="411.8" y="231.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">1.60 s</text><rect x="224" y="240" width="100.6" height="20" rx="4" fill="#E4572E"/><text x="332.6" y="255.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">0.90 s</text><rect x="224" y="264" width="101.8" height="20" rx="4" fill="#3B6FE0"/><text x="333.8" y="279.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">0.91 s</text><text x="24.0" y="331.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Exa</text><rect x="224" y="304" width="317.5" height="20" rx="4" fill="#E4572E"/><text x="549.5" y="319.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">2.83 s</text><rect x="224" y="328" width="162.1" height="20" rx="4" fill="#3B6FE0"/><text x="394.1" y="343.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">1.44 s</text><text x="24.0" y="407.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Jina Reader</text><rect x="224" y="368" width="426.0" height="20" rx="4" fill="#E8A80C"/><text x="658.0" y="383.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">3.79 s</text><rect x="224" y="392" width="112.4" height="20" rx="4" fill="#E4572E"/><text x="344.4" y="407.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">1.00 s</text><rect x="224" y="416" width="24.6" height="20" rx="4" fill="#3B6FE0"/><text x="256.6" y="431.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">0.22 s</text><text x="24.0" y="470.0" font-size="11.5" fill="#59636E" text-anchor="start" font-weight="400">Before and fine-tuned ran side by side: 30 fresh questions, alternating order. Reader: separate runs. Exa original: no valid key.</text></svg>