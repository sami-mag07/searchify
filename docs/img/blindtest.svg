<svg xmlns="http://www.w3.org/2000/svg" width="760" height="346" viewBox="0 0 760 346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="760" height="346" rx="12" fill="#FFFFFF" stroke="#E6E8EB"/><text x="24.0" y="34.0" font-size="17" fill="#1F2328" text-anchor="start" font-weight="650">Wie seriös sind die Quellen, die die Suche liefert?</text><text x="24.0" y="58.0" font-size="13.5" fill="#1A7F45" text-anchor="start" font-weight="650">Ergebnis: Unser Nachbau ist fast so gut wie Tavily (3,51 zu 3,56), vorher 3,14.</text><text x="24.0" y="80.0" font-size="12" fill="#59636E" text-anchor="start" font-weight="400">30 Faktenfragen, blind bewertet. Jeder Punkt = eine Frage, schwarzer Strich = Durchschnitt.</text><circle cx="30" cy="104" r="6" fill="#E0A100"/><text x="42.0" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Original-Anbieter</text><circle cx="171.4" cy="104" r="6" fill="#D64545"/><text x="183.4" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Unser Nachbau vorher (11.10.)</text><circle cx="387.20000000000005" cy="104" r="6" fill="#2E9E5B"/><text x="399.2" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Unser Nachbau jetzt (13.10.)</text><text x="736.0" y="124.0" font-size="11.5" fill="#59636E" text-anchor="end" font-weight="400">Durchschnitt</text><line x1="224.0" x2="224.0" y1="128" y2="266" stroke="#E6E8EB"/><text x="224.0" y="282.0" font-size="11" fill="#59636E" text-anchor="middle" font-weight="400">1</text><line x1="328.0" x2="328.0" y1="128" y2="266" stroke="#E6E8EB"/><text x="328.0" y="282.0" font-size="11" fill="#59636E" text-anchor="middle" font-weight="400">2</text><line x1="432.0" x2="432.0" y1="128" y2="266" stroke="#E6E8EB"/><text x="432.0" y="282.0" font-size="11" fill="#59636E" text-anchor="middle" font-weight="400">3</text><line x1="536.0" x2="536.0" y1="128" y2="266" stroke="#E6E8EB"/><text x="536.0" y="282.0" font-size="11" fill="#59636E" text-anchor="middle" font-weight="400">4</text><line x1="640.0" x2="640.0" y1="128" y2="266" stroke="#E6E8EB"/><text x="640.0" y="282.0" font-size="11" fill="#59636E" text-anchor="middle" font-weight="400">5</text><text x="224.0" y="300.0" font-size="11.5" fill="#59636E" text-anchor="start" font-weight="400">1 = unseriös</text><text x="640.0" y="300.0" font-size="11.5" fill="#1F2328" text-anchor="end" font-weight="600">5 = sehr seriös  →  besser</text><text x="24.0" y="155.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="400">Tavily (Original)</text><circle cx="536.0" cy="142.6" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="501.3" cy="142.6" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="466.7" cy="142.6" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="570.7" cy="142.6" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="466.7" cy="146.8" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="605.3" cy="142.6" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="640.0" cy="142.6" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="362.7" cy="142.6" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="328.0" cy="142.6" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="397.3" cy="142.6" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="605.3" cy="146.8" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="570.7" cy="146.8" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="640.0" cy="146.8" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="605.3" cy="151.0" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="362.7" cy="146.8" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="501.3" cy="146.8" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="536.0" cy="146.8" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="466.7" cy="151.0" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="293.3" cy="142.6" r="5" fill="#E0A100" fill-opacity="0.45"/><circle cx="432.0" c