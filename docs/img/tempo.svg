<svg xmlns="http://www.w3.org/2000/svg" width="760" height="484" viewBox="0 0 760 484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="760" height="484" rx="12" fill="#FFFFFF" stroke="#E6E8EB"/><text x="24.0" y="34.0" font-size="17" fill="#1F2328" text-anchor="start" font-weight="650">Wie lange dauert eine typische Anfrage?</text><text x="24.0" y="58.0" font-size="13.5" fill="#1A7F45" text-anchor="start" font-weight="650">Ergebnis: Unser Nachbau ist bei jedem Tool schneller als das Original.</text><text x="24.0" y="80.0" font-size="12" fill="#59636E" text-anchor="start" font-weight="400">Typische Antwortzeit in Sekunden (Median). Kürzer ist besser.</text><circle cx="30" cy="104" r="6" fill="#E0A100"/><text x="42.0" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Original-Anbieter</text><circle cx="171.4" cy="104" r="6" fill="#D64545"/><text x="183.4" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Unser Nachbau vorher (11.10.)</text><circle cx="387.20000000000005" cy="104" r="6" fill="#2E9E5B"/><text x="399.2" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Unser Nachbau jetzt (13.10.)</text><text x="24.0" y="167.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Tavily-Suche</text><rect x="224" y="128" width="135.5" height="20" rx="4" fill="#E0A100"/><text x="367.5" y="143.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">1,33 s</text><rect x="224" y="152" width="113.1" height="20" rx="4" fill="#D64545"/><text x="345.1" y="167.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">1,11 s</text><rect x="224" y="176" width="85.6" height="20" rx="4" fill="#2E9E5B"/><text x="317.6" y="191.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">0,84 s</text><text x="24.0" y="255.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Serper</text><rect x="224" y="216" width="163.0" height="20" rx="4" fill="#E0A100"/><text x="395.0" y="231.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">1,60 s</text><rect x="224" y="240" width="98.8" height="20" rx="4" fill="#D64545"/><text x="330.8" y="255.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">0,97 s</text><rect x="224" y="264" width="80.5" height="20" rx="4" fill="#2E9E5B"/><text x="312.5" y="279.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">0,79 s</text><text x="24.0" y="331.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Exa</text><rect x="224" y="304" width="229.2" height="20" rx="4" fill="#D64545"/><text x="461.2" y="319.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">2,25 s</text><rect x="224" y="328" width="172.1" height="20" rx="4" fill="#2E9E5B"/><text x="404.1" y="343.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">1,69 s</text><text x="24.0" y="407.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Jina-Reader</text><rect x="224" y="368" width="386.0" height="20" rx="4" fill="#E0A100"/><text x="618.0" y="383.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">3,79 s</text><rect x="224" y="392" width="101.8" height="20" rx="4" fill="#D64545"/><text x="333.8" y="407.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">1,00 s</text><rect x="224" y="416" width="45.8" height="20" rx="4" fill="#2E9E5B"/><text x="277.8" y="431.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">0,45 s</text><text x="24.0" y="470.0" font-size="11.5" fill="#59636E" text-anchor="start" font-weight="400">Exa-Original: kein gültiger Key, darum ohne gelben Balken.</text></svg>