<svg xmlns="http://www.w3.org/2000/svg" width="800" height="268" viewBox="0 0 800 268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="800" height="268" rx="12" fill="#FFFFFF" stroke="#EAECEF"/><text x="24.0" y="34.0" font-size="17" fill="#1F2328" text-anchor="start" font-weight="650">How many SEO and ad pages are among the top results?</text><text x="24.0" y="58.0" font-size="13.5" fill="#1D4ED8" text-anchor="start" font-weight="650">Result: Down from 36 to 15, level with Tavily.</text><text x="24.0" y="80.0" font-size="12" fill="#59636E" text-anchor="start" font-weight="400">30 questions times top 3 results = 90 results per system. Fewer is better.</text><circle cx="30" cy="104" r="6" fill="#E8A80C"/><text x="42.0" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Original provider</text><circle cx="166.0" cy="104" r="6" fill="#E4572E"/><text x="178.0" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Our clone, before (Oct 11)</text><circle cx="356.0" cy="104" r="6" fill="#12A36B"/><text x="368.0" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Our clone, now (Oct 13)</text><circle cx="528.0" cy="104" r="6" fill="#3B6FE0"/><text x="540.0" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">After fine-tuning</text><text x="24.0" y="179.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Tavily search</text><rect x="224" y="128" width="177.5" height="20" rx="4" fill="#E8A80C"/><text x="409.5" y="143.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">15 of 90</text><rect x="224" y="152" width="426.0" height="20" rx="4" fill="#E4572E"/><text x="658.0" y="167.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">36 of 90</text><rect x="224" y="176" width="272.2" height="20" rx="4" fill="#12A36B"/><text x="504.2" y="191.0" font-size="13" fill="#1F2