<svg xmlns="http://www.w3.org/2000/svg" width="760" height="222" viewBox="0 0 760 222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="760" height="222" rx="12" fill="#FFFFFF" stroke="#E6E8EB"/><text x="24.0" y="34.0" font-size="17" fill="#1F2328" text-anchor="start" font-weight="650">Wie viele SEO- und Werbeseiten sind unter den Top-Treffern?</text><text x="24.0" y="58.0" font-size="13.5" fill="#1A7F45" text-anchor="start" font-weight="650">Ergebnis: Von 36 auf 23 gesenkt, Tavily liegt mit 15 noch besser.</text><text x="24.0" y="80.0" font-size="12" fill="#59636E" text-anchor="start" font-weight="400">30 Fragen mal 3 Top-Treffer = 90 Treffer je System. Weniger ist besser.</text><circle cx="30" cy="104" r="6" fill="#E0A100"/><text x="42.0" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Original-Anbieter</text><circle cx="171.4" cy="104" r="6" fill="#D64545"/><text x="183.4" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Unser Nachbau vorher (11.10.)</text><circle cx="387.20000000000005" cy="104" r="6" fill="#2E9E5B"/><text x="399.2" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Unser Nachbau jetzt (13.10.)</text><text x="24.0" y="167.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Tavily-Suche</text><rect x="224" y="128" width="160.8" height="20" rx="4" fill="#E0A100"/><text x="392.8" y="143.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">15 von 90</text><rect x="224" y="152" width="386.0" height="20" rx="4" fill="#D64545"/><text x="618.0" y="167.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">36 von 90</text><rect x="224" y="176" width="246.6" height="20" rx="4" fill="#2E9E5B"/><text x="478.6" y="191.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">23 von 90</text></svg>