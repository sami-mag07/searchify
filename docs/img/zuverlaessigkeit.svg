<svg xmlns="http://www.w3.org/2000/svg" width="760" height="284" viewBox="0 0 760 284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="760" height="284" rx="12" fill="#FFFFFF" stroke="#E6E8EB"/><text x="24.0" y="34.0" font-size="17" fill="#1F2328" text-anchor="start" font-weight="650">Wie oft geht eine Anfrage schief?</text><text x="24.0" y="58.0" font-size="13.5" fill="#1A7F45" text-anchor="start" font-weight="650">Ergebnis: Im Normalbetrieb kein einziger Fehler mehr, beim Ausfall halb so viele.</text><text x="24.0" y="80.0" font-size="12" fill="#59636E" text-anchor="start" font-weight="400">Anfragen, die mit Fehler oder ohne Treffer enden. Weniger ist besser.</text><circle cx="30" cy="104" r="6" fill="#D64545"/><text x="42.0" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Unser Nachbau vorher (11.10.)</text><circle cx="245.8" cy="104" r="6" fill="#2E9E5B"/><text x="257.8" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Unser Nachbau jetzt (13.10.)</text><text x="24.0" y="155.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Normalbetrieb</text><rect x="224" y="128" width="14.2" height="20" rx="4" fill="#D64545"/><text x="246.2" y="143.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">3 von 160 (1,9 %)</text><rect x="224" y="152" width="3.0" height="20" rx="4" fill="#2E9E5B"/><text x="235.0" y="167.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">0 von 194 (0 %)</text><text x="24.0" y="219.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Eigene Suchmaschine aus</text><rect x="224" y="192" width="386.0" height="20" rx="4" fill="#D64545"/><text x="618.0" y="207.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">25 von 49 (51 %)</text><rect x="224" y="216" width="200.7" height="20" rx="4" fill="#2E9E5B"/><text x="432.7" y="231.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">13 von 49 (27 %)</text><text x="24.0" y="270.0" font-size="11.5" fill="#59636E" text-anchor="start" font-weight="400">„Eigene Suchmaschine aus“: SearXNG absichtlich abgeschaltet, um den Notfall zu testen.</text></svg>