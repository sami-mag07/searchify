<svg xmlns="http://www.w3.org/2000/svg" width="800" height="308" viewBox="0 0 800 308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="800" height="308" rx="12" fill="#FFFFFF" stroke="#EAECEF"/><text x="24.0" y="34.0" font-size="17" fill="#1F2328" text-anchor="start" font-weight="650">How often does a request fail?</text><text x="24.0" y="58.0" font-size="13.5" fill="#1D4ED8" text-anchor="start" font-weight="650">Result: Almost no errors in normal operation, half as many when the search engine is down.</text><text x="24.0" y="80.0" font-size="12" fill="#59636E" text-anchor="start" font-weight="400">Requests that end with an error or without results. Fewer is better.</text><circle cx="30" cy="104" r="6" fill="#E4572E"/><text x="42.0" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Our clone, before (Oct 11)</text><circle cx="220.0" cy="104" r="6" fill="#12A36B"/><text x="232.0" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Our clone, now (Oct 13)</text><circle cx="392.0" cy="104" r="6" fill="#3B6FE0"/><text x="404.0" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">After fine-tuning</text><text x="24.0" y="167.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Normal operation</text><rect x="224" y="128" width="15.7" height="20" rx="4" fill="#E4572E"/><text x="247.7" y="143.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">3 of 160 (1.9 %)</text><rect x="224" y="152" width="3.0" height="20" rx="4" fill="#12A36B"/><text x="235.0" y="167.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">0 of 194 (0 %)</text><rect x="224" y="176" width="5.9" height="20" rx="4" fill="#3B6FE0"/><text x="237.9" y="191.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">1 of 141 (0.7 %)</text><text x="24.0" y="243.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Own search engine down</text><rect x="224" y="216" width="426.0" height="20" rx="4" fill="#E4572E"/><text x="658.0" y="231.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">25 of 49 (51 %)</text><rect x="224" y="240" width="221.5" height="20" rx="4" fill="#12A36B"/><text x="453.5" y="255.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">13 of 49 (27 %)</text><text x="24.0" y="294.0" font-size="11.5" fill="#59636E" text-anchor="start" font-weight="400">Search engine down: SearXNG switched off on purpose to test the fallback. Not repeated after fine-tuning.</text></svg>