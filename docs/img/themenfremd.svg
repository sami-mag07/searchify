<svg xmlns="http://www.w3.org/2000/svg" width="760" height="252" viewBox="0 0 760 252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="760" height="252" rx="12" fill="#FFFFFF" stroke="#E6E8EB"/><text x="24.0" y="34.0" font-size="17" fill="#1F2328" text-anchor="start" font-weight="650">Themenfremde Treffer bei einer echten Aufgabe</text><text x="24.0" y="56.0" font-size="12.5" fill="#59636E" text-anchor="start" font-weight="400">8 Suchen nach Offshore-Kontakten. Gezählt: Shopping-Sender HSE, Wörterbücher, Banken mit ähnlichem Namen.</text><circle cx="30" cy="76" r="6" fill="#D64545"/><text x="42.0" y="80.0" font-size="12" fill="#59636E" text-anchor="start" font-weight="400">Nachbau alt (11.10.)</text><circle cx="190.0" cy="76" r="6" fill="#2E9E5B"/><text x="202.0" y="80.0" font-size="12" fill="#59636E" text-anchor="start" font-weight="400">Nachbau neu (13.10.)</text><text x="736.0" y="80.0" font-size="12" fill="#59636E" text-anchor="end" font-weight="400">kleiner ist besser</text><text x="24.0" y="121.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="400">Tavily-Nachbau</text><rect x="224" y="96" width="424.8" height="18" rx="4" fill="#D64545"/><text x="656.8" y="109.5" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600">18</text><rect x="224" y="118" width="23.6" height="18" rx="4" fill="#2E9E5B"/><text x="255.6" y="131.5" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600">1</text><text x="24.0" y="181.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="400">Serper-Nachbau</text><rect x="224" y="156" width="401.2" height="18" rx="4" fill="#D64545"/><text x="633.2" y="169.5" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600">17</text><rect x="224" y="178" width="47.2" height="18" rx="4" fill="#2E9E5B"/><text x="279.2" y="191.5" font-size="12.5" fill="#1F2328" text-anchor="start" font-weight="600">2</text><text x="24.0" y="238.0" font-size="11.5" fill="#59636E" text-anchor="start" font-weight="400">Tavily-Nachbau: 18 von 77 Treffern vorher, 1 von 61 nachher. Serper-Nachbau: 17 von 80, dann 2 von 80.</text></svg>