<svg xmlns="http://www.w3.org/2000/svg" width="760" height="262" viewBox="0 0 760 262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect width="760" height="262" rx="12" fill="#FFFFFF" stroke="#E6E8EB"/><text x="24.0" y="34.0" font-size="17" fill="#1F2328" text-anchor="start" font-weight="650">Wie viele Treffer haben nichts mit der Frage zu tun?</text><text x="24.0" y="58.0" font-size="13.5" fill="#1A7F45" text-anchor="start" font-weight="650">Ergebnis: Fast alle themenfremden Treffer sind weg: 18 auf 1 und 17 auf 2.</text><text x="24.0" y="80.0" font-size="12" fill="#59636E" text-anchor="start" font-weight="400">8 Suchen nach Offshore-Kontakten. Themenfremd: Shopping-Sender HSE, Wörterbücher, Banken. Weniger ist besser.</text><circle cx="30" cy="104" r="6" fill="#D64545"/><text x="42.0" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Unser Nachbau vorher (11.10.)</text><circle cx="245.8" cy="104" r="6" fill="#2E9E5B"/><text x="257.8" y="108.0" font-size="12" fill="#1F2328" text-anchor="start" font-weight="400">Unser Nachbau jetzt (13.10.)</text><text x="24.0" y="155.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Tavily-Nachbau</text><rect x="224" y="128" width="386.0" height="20" rx="4" fill="#D64545"/><text x="618.0" y="143.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">18 von 77 Treffern</text><rect x="224" y="152" width="21.4" height="20" rx="4" fill="#2E9E5B"/><text x="253.4" y="167.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">1 von 61 Treffern</text><text x="24.0" y="219.0" font-size="13.5" fill="#1F2328" text-anchor="start" font-weight="600">Serper-Nachbau</text><rect x="224" y="192" width="364.6" height="20" rx="4" fill="#D64545"/><text x="596.6" y="207.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">17 von 80 Treffern</text><rect x="224" y="216" width="42.9" height="20" rx="4" fill="#2E9E5B"/><text x="274.9" y="231.0" font-size="13" fill="#1F2328" text-anchor="start" font-weight="650">2 von 80 Treffern</text></svg>